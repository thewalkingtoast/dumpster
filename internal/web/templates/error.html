<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} &middot; Dumpster</title>
  <!-- Synchronous on purpose: sets data-theme before the first paint. -->
  <script src="{{asset "theme.js"}}"></script>
  <link rel="icon" href="{{asset "icon.svg"}}" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="{{asset "apple-touch-icon.png"}}">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0c0b10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f3fa" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="{{asset "style.css"}}">
</head>
<body class="home">
  <main class="hero">
    <div class="corner">{{template "themeToggle"}}</div>
    <h1>{{.Title}}</h1>
    <p class="lede">{{.Message}}</p>
    {{if .Rent}}
    <form method="post" action="/rent">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <button class="cta" type="submit">Rent a dumpster</button>
    </form>
    {{end}}
  </main>
</body>
</html>
